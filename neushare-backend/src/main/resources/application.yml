server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: neushare-backend
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/neushare?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:SQS626070}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: ${JWT_SECRET:neushare2024secretkeyforjwttoken123456789}
  expiration: 86400000

# 用户自带 AI API Key（BYOK）的落库加密主密钥
# 生产环境必须换掉默认值（换密钥 = 旧密文全部作废，需全量重加密）
ai:
  key-encrypt-secret: ${AI_KEY_ENCRYPT_SECRET:neushare-byok-dev-secret-do-not-use-in-prod}

file:
  upload:
    path: uploads

logging:
  level:
    com.neushare: debug

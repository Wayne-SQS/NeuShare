# NeuShare 部署编排（2026-11-18 起 Java 后端退役，全部为 Python）
#
#   前端 :80  ──/api/──▶  backend(FastAPI) :8080
#             ──/ai/───▶  ai(FastAPI+LangGraph) :8000  ──▶ MySQL
#   两个 Python 服务共享同一 JWT_SECRET 与 uploads 卷
#
# .env 必填：MYSQL_ROOT_PASSWORD / JWT_SECRET / AI_KEY_ENCRYPT_SECRET
services:
  db:
    image: mysql:8.0
    container_name: neushare-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: neushare
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./neushare-backend-py
    container_name: neushare-backend
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DB: neushare
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      AI_KEY_ENCRYPT_SECRET: ${AI_KEY_ENCRYPT_SECRET:?请在 .env 中设置 AI_KEY_ENCRYPT_SECRET}
      UPLOAD_PATH: /app/uploads
      CORS_ORIGINS: http://localhost,http://127.0.0.1:3000
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  ai:
    build: ./neushare-ai
    container_name: neushare-ai
    environment:
      # 主后端地址：变量名沿用 JAVA_BACKEND_URL 以兼容既有配置
      JAVA_BACKEND_URL: http://backend:8080
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DB: neushare
      AI_SERVICE_PORT: "8000"
      UPLOADS_DIR: /app/uploads
      VECTORSTORE_DIR: /app/vectorstore
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
      - vectorstore-data:/app/vectorstore
    depends_on:
      - backend

  frontend:
    build: ./neushare-frontend
    container_name: neushare-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai

volumes:
  mysql-data:
  uploads-data:
  vectorstore-data:

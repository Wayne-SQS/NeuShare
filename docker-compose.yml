services:
  db:
    image: mysql:8.0
    container_name: neushare-db
    environment:
      MYSQL_ROOT_PASSWORD: SQS626070
      MYSQL_DATABASE: neushare
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./neushare-backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./neushare-backend
    container_name: neushare-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/neushare?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: SQS626070
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./neushare-frontend
    container_name: neushare-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads-data:
